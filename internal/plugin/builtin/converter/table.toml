# Built-in cross-manager package name translations.
#
# Each entry maps one logical package to its name in every manager that ships
# it. Supported manager keys: apt, dnf, pacman, brew, brew-cask, nix, snap,
# flatpak, pip, cargo, npm. A missing key means "no known equivalent"; an
# explicit "" means "known to be unavailable". brew names are formulas;
# brew-cask names are casks.
#
# Users can extend or override this table with their own file via the
# converter plugin's "table" setting (same format).

